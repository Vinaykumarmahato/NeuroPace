version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: neuropace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: neuropace
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: neuropace-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: